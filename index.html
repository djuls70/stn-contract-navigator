<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic TextNavigator — Сверка условий договоров поставки</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Зона 1: Компактная одноуровневая верхняя панель (Header + Controls) -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="brand-title">Semantic TextNavigator</div>
      <input type="file" id="fileInputReplace" multiple accept=".txt,text/plain" style="display:none" onchange="handleFilesUpload(event, true)">
      <input type="file" id="fileInputAppend" multiple accept=".txt,text/plain" style="display:none" onchange="handleFilesUpload(event, false)">
      <button type="button" class="btn btn-primary" onclick="document.getElementById('fileInputReplace').click()">Загрузить .txt файлы</button>
      <button type="button" class="btn" onclick="document.getElementById('fileInputAppend').click()">+ Добавить файл</button>
      <button type="button" class="btn" onclick="resetToDemoFiles()">Сброс (6 демо-файлов)</button>
    </div>

    <div class="top-bar-right">
      <div class="date-control-group">
        <span class="date-label">Дата проверки:</span>
        <input type="date" id="checkDateInput" class="date-input" value="2026-03-10" onchange="onDateInputChange(this.value)">
      </div>
      <button type="button" id="presetBtnMain" class="btn btn-preset active" onclick="setCheckDatePreset('2026-03-10')">10.03.2026</button>
      <button type="button" id="presetBtnBefore" class="btn btn-preset" onclick="setCheckDatePreset('2026-02-20')">20.02.2026 (до ДС №1)</button>
      <span class="top-divider"></span>
      <button type="button" id="togglePenaltyBtn" class="btn btn-toggle" onclick="togglePenaltyColumn()">+ Неустойка (п. 4.1)</button>
      <button type="button" class="btn" onclick="openSelfTestsModal()">Автотесты (14)</button>
    </div>
  </header>

  <!-- Зона 2: Полоса из 4 карточек «Вопросы закупщика» -->
  <section class="questions-section">
    <div id="questionsGrid" class="questions-grid"></div>
    <div id="qAnswerDrawer" class="q-answer-drawer">
      <div id="qDrawerDetails" class="q-drawer-main"></div>
      <div id="qDrawerCites" class="q-drawer-cites"></div>
      <button type="button" class="btn-clear-q" onclick="clearQuestionFilter()">✕ Сбросить фильтр</button>
    </div>
  </section>

  <!-- Зона 3: Основная рабочая область (Таблица слева + Первоисточник справа) -->
  <main class="workspace-grid">
    <div class="table-panel">
      <table id="contractsTable" class="contracts-table">
        <thead>
          <tr>
            <th class="col-c1">Договор и Поставщик</th>
            <th class="col-c2">Документы пакета</th>
            <th class="col-c3">Сумма договора</th>
            <th class="col-c4">Срок поставки</th>
            <th class="col-penalty">Неустойка (п. 4.1)</th>
            <th class="col-c6">Сведения для проверки</th>
          </tr>
        </thead>
        <tbody id="contractsTableBody"></tbody>
      </table>
    </div>

    <aside class="viewer-panel">
      <div class="viewer-header">
        <span class="viewer-title">Первоисточник и проверка цитаты</span>
        <span id="viewerDocSignBadge" class="badge-sign badge-signed">Подписан обеими сторонами</span>
      </div>
      <div id="viewerTabs" class="viewer-tabs"></div>
      <div id="activeCitationBanner" class="citation-banner"></div>
      <div id="viewerBody" class="viewer-body"></div>
    </aside>
  </main>

  <!-- Зона 4: Модальное окно для «Автотестов (14)» -->
  <div id="selftestModalBackdrop" class="modal-backdrop" onclick="onModalBackdropClick(event)">
    <div class="modal-window">
      <div class="modal-header">
        <div id="selftestSummaryTitle" class="modal-title">Пройдено 14 из 14 тестов</div>
        <button type="button" class="btn" onclick="closeSelfTestsModal()">✕ Закрыть</button>
      </div>
      <div id="selftestGrid" class="modal-body"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script>
    var currentFiles = [];
    var currentCheckDateRU = '10.03.2026';
    var resolvedState = null;
    var currentQuestions = [];
    var activeQuestionId = null;
    var showPenaltyCol = false;
    var activeViewerState = {
      fileName: '01_contract.txt',
      paragraphId: null,
      labelText: 'Выберите любую сумму, дату, документ или предупреждение в таблице слева для проверки абзаца и цитаты.',
      exactQuote: null,
      highlightToken: null
    };
    var citationRegistry = [];

    function registerCite(fileName, paragraphId, labelText, exactQuote, highlightToken) {
      var id = citationRegistry.length;
      citationRegistry.push({
        fileName: fileName,
        paragraphId: paragraphId || 'p_1',
        labelText: labelText || '',
        exactQuote: exactQuote || '',
        highlightToken: highlightToken || ''
      });
      return id;
    }

    function openCite(citeId) {
      var item = citationRegistry[citeId];
      if (!item) return;
      focusCitation(item.fileName, item.paragraphId, item.labelText, item.exactQuote, item.highlightToken);
    }

    function setupDragAndDrop() {
      window.addEventListener('dragover', function (e) {
        e.preventDefault();
        document.body.classList.add('drag-over');
      });
      window.addEventListener('dragleave', function (e) {
        if (!e.relatedTarget || e.relatedTarget.nodeName === 'HTML') {
          document.body.classList.remove('drag-over');
        }
      });
      window.addEventListener('drop', function (e) {
        e.preventDefault();
        document.body.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          readUploadedFileList(e.dataTransfer.files, false);
        }
      });
    }

    function resetToDemoFiles() {
      currentFiles = window.STNEngine.DEFAULT_DOCUMENTS.map(function (d) {
        return { fileName: d.fileName, content: d.content };
      });
      activeQuestionId = null;
      setCheckDatePreset('2026-03-10');
      focusCitation('02_amendment_signed.txt', 'p_3', 'Демо-пакет (6 файлов): проверка срока поставки STN-101 по подписанному ДС № 1', 'Поставщик обязуется поставить оборудование не позднее 30.04.2026', '30.04.2026');
    }

    function handleFilesUpload(event, replaceAll) {
      var files = event.target.files;
      if (files && files.length > 0) {
        readUploadedFileList(files, replaceAll);
      }
      event.target.value = '';
    }

    function readUploadedFileList(rawFiles, replaceAll) {
      var list = Array.prototype.slice.call(rawFiles);
      var loaded = [];
      var remaining = list.length;

      list.forEach(function (file) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          loaded.push({ fileName: file.name, content: String(ev.target.result || '') });
          remaining--;
          if (remaining === 0) {
            if (replaceAll) {
              currentFiles = loaded;
            } else {
              loaded.forEach(function (nf) {
                var replaced = false;
                for (var i = 0; i < currentFiles.length; i++) {
                  if (currentFiles[i].fileName === nf.fileName) {
                    currentFiles[i] = nf;
                    replaced = true;
                    break;
                  }
                }
                if (!replaced) currentFiles.push(nf);
              });
            }
            activeQuestionId = null;
            recomputeAndRender();
            if (loaded[0]) {
              focusCitation(loaded[0].fileName, 'p_1', 'Загружен документ: ' + loaded[0].fileName, '', '');
            }
          }
        };
        reader.readAsText(file, 'UTF-8');
      });
    }

    function isoToRuDate(isoVal) {
      var m = String(isoVal || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? (m[3] + '.' + m[2] + '.' + m[1]) : '10.03.2026';
    }

    function onDateInputChange(isoVal) {
      currentCheckDateRU = isoToRuDate(isoVal);
      document.getElementById('presetBtnMain').className = 'btn btn-preset' + (isoVal === '2026-03-10' ? ' active' : '');
      document.getElementById('presetBtnBefore').className = 'btn btn-preset' + (isoVal === '2026-02-20' ? ' active' : '');
      recomputeAndRender();
    }

    function setCheckDatePreset(isoVal) {
      document.getElementById('checkDateInput').value = isoVal;
      onDateInputChange(isoVal);
    }

    function togglePenaltyColumn() {
      showPenaltyCol = !showPenaltyCol;
      var btn = document.getElementById('togglePenaltyBtn');
      var tbl = document.getElementById('contractsTable');
      btn.className = 'btn btn-toggle' + (showPenaltyCol ? ' active' : '');
      btn.textContent = showPenaltyCol ? '✓ Неустойка (п. 4.1)' : '+ Неустойка (п. 4.1)';
      tbl.className = 'contracts-table' + (showPenaltyCol ? ' show-penalty' : '');
    }

    function recomputeAndRender() {
      citationRegistry = [];
      resolvedState = window.STNEngine.resolveContracts(currentFiles, currentCheckDateRU);
      currentQuestions = window.STNEngine.answerQuestions(resolvedState, '01.04.2026');
      renderQuestions();
      renderTable();
      renderViewer();
    }

    function renderQuestions() {
      var gridHtml = [];
      var activeQ = null;

      for (var i = 0; i < currentQuestions.length; i++) {
        var q = currentQuestions[i];
        var isActive = (q.id === activeQuestionId);
        if (isActive) activeQ = q;
        gridHtml.push(
          '<div class="q-card' + (isActive ? ' active' : '') + '" onclick="selectQuestion(\'' + escapeAttr(q.id) + '\')">' +
            '<div class="q-card-question">' + escapeHtml(q.question) + '</div>' +
            '<div class="q-card-answer">' + escapeHtml(q.shortAnswer) + '</div>' +
          '</div>'
        );
      }
      document.getElementById('questionsGrid').innerHTML = gridHtml.join('');

      var drawer = document.getElementById('qAnswerDrawer');
      if (!activeQ) {
        drawer.className = 'q-answer-drawer';
        return;
      }

      document.getElementById('qDrawerDetails').textContent = activeQ.details;
      var citesHtml = [];
      for (var j = 0; j < (activeQ.citations || []).length; j++) {
        var c = activeQ.citations[j];
        var cid = registerCite(c.fileName, c.paragraphId, activeQ.question + ' — ' + c.label, c.quote, '');
        citesHtml.push(
          '<button type="button" class="btn-cite-Light" onclick="openCite(' + cid + ')">📄 ' +
            escapeHtml(c.label) +
          '</button>'
        );
      }
      document.getElementById('qDrawerCites').innerHTML = citesHtml.join('');
      drawer.className = 'q-answer-drawer visible';
    }

    function selectQuestion(qId) {
      if (activeQuestionId === qId) {
        clearQuestionFilter();
        return;
      }
      activeQuestionId = qId;
      recomputeAndRender();
      for (var i = 0; i < currentQuestions.length; i++) {
        var q = currentQuestions[i];
        if (q.id === qId && q.citations && q.citations[0]) {
          var fc = q.citations[0];
          focusCitation(fc.fileName, fc.paragraphId, q.question + ' — ' + fc.label, fc.quote, q.shortAnswer);
          break;
        }
      }
    }

    function clearQuestionFilter() {
      activeQuestionId = null;
      recomputeAndRender();
    }

    function formatClauseRef(fileName, clause) {
      return '📄 ' + fileName + (clause ? ', п. ' + clause : '');
    }

    function renderTable() {
      var tbody = document.getElementById('contractsTableBody');
      var contracts = (resolvedState && resolvedState.contracts) || [];
      var activeFilterIds = null;

      if (activeQuestionId) {
        for (var qIdx = 0; qIdx < currentQuestions.length; qIdx++) {
          if (currentQuestions[qIdx].id === activeQuestionId) {
            activeFilterIds = currentQuestions[qIdx].filterContracts || [];
            break;
          }
        }
      }

      var rowsHtml = [];
      for (var i = 0; i < contracts.length; i++) {
        var c = contracts[i];
        var rowClass = '';
        if (activeFilterIds) {
          rowClass = activeFilterIds.indexOf(c.contractId) !== -1 ? 'row-highlighted' : 'row-dimmed';
        }

        // 1. Договор и Поставщик
        var colContract =
          '<div class="contract-id">' + escapeHtml(c.contractId) + '</div>' +
          '<div class="supplier-name">' + escapeHtml(c.supplier || 'Поставщик не указан') + '</div>' +
          '<div class="contract-meta">' +
            'Покупатель: ' + escapeHtml(c.buyer || '—') +
            (c.subject ? '<br>Предмет: ' + escapeHtml(c.subject) : '') +
          '</div>';

        // 2. Документы пакета
        var docsHtml = [];
        for (var dIdx = 0; dIdx < (c.relatedDocs || []).length; dIdx++) {
          var rd = c.relatedDocs[dIdx];
          var dCiteId = registerCite(rd.fileName, rd.paragraphId || 'p_1', c.contractId + ': ' + rd.docTitle, rd.quote || '', '');
          var signBadge = rd.isSigned
            ? '<span class="badge-sign badge-signed">Подписан</span>'
            : '<span class="badge-sign badge-unsigned">Не подписан</span>';
          docsHtml.push(
            '<button type="button" class="doc-pill" onclick="openCite(' + dCiteId + ')">' +
              '<div class="doc-pill-top">' +
                '<span class="doc-pill-title">' + escapeHtml(rd.docTitle) + '</span>' +
                signBadge +
              '</div>' +
              '<div class="doc-pill-file">' + escapeHtml(rd.fileName) + '</div>' +
            '</button>'
          );
        }
        var colDocs = '<div class="doc-pill-list">' + docsHtml.join('') + '</div>';

        // 3. Сумма договора
        var amt = c.activeAmount || { status: 'missing', displayValue: 'нет данных' };
        var amtCiteId = registerCite(
          amt.fileName || (c.relatedDocs[0] && c.relatedDocs[0].fileName) || '01_contract.txt',
          amt.paragraphId || 'p_1',
          c.contractId + ' — Сумма договора: ' + amt.displayValue,
          amt.exactQuote || amt.quote || '',
          amt.displayValue
        );
        var colAmount = '';
        if (amt.status === 'missing') {
          colAmount += '<div><span class="badge-missing" onclick="openCite(' + amtCiteId + ')">нет данных</span></div>';
        } else {
          colAmount += '<div><span class="val-primary" onclick="openCite(' + amtCiteId + ')">' + escapeHtml(amt.displayValue) + '</span></div>';
        }
        if (amt.changedBy) {
          colAmount += '<div class="change-note">Изменено: ' + escapeHtml(amt.changedBy) + (amt.effectiveDate ? ' (с ' + escapeHtml(amt.effectiveDate) + ')' : '') + '</div>';
          if (c.amountHistory && c.amountHistory.length > 0) {
            var oldAmt = c.amountHistory[0];
            var oldAmtCiteId = registerCite(oldAmt.fileName, oldAmt.paragraphId, c.contractId + ' — Прежняя сумма: ' + oldAmt.displayValue, oldAmt.exactQuote || oldAmt.quote || '', oldAmt.displayValue);
            colAmount += '<div><span class="old-val-link" onclick="openCite(' + oldAmtCiteId + ')">Было: ' + escapeHtml(oldAmt.displayValue) + '</span></div>';
          }
        }
        if (amt.fileName) {
          colAmount += '<div><button type="button" class="source-btn" onclick="openCite(' + amtCiteId + ')">' + escapeHtml(formatClauseRef(amt.fileName, amt.clause)) + '</button></div>';
        }

        // 4. Срок поставки
        var deliv = c.activeDeliveryDate || { status: 'missing', value: 'нет данных' };
        var delivVal = deliv.value || deliv.displayValue || 'нет данных';
        var delivCiteId = registerCite(
          deliv.fileName || (c.relatedDocs[0] && c.relatedDocs[0].fileName) || '01_contract.txt',
          deliv.paragraphId || 'p_1',
          c.contractId + ' — Срок поставки: ' + delivVal,
          deliv.exactQuote || deliv.quote || '',
          delivVal
        );
        var colDeliv = '';
        if (deliv.status === 'missing') {
          colDeliv += '<div><span class="badge-missing" onclick="openCite(' + delivCiteId + ')">нет данных</span></div>';
        } else {
          colDeliv += '<div><span class="val-primary" onclick="openCite(' + delivCiteId + ')">' + escapeHtml(delivVal) + '</span></div>';
        }
        if (deliv.changedBy) {
          colDeliv += '<div class="change-note">Изменено: ' + escapeHtml(deliv.changedBy) + '</div>';
          if (c.deliveryDateHistory && c.deliveryDateHistory.length > 0) {
            var oldDel = c.deliveryDateHistory[0];
            var oldDelVal = oldDel.value || oldDel.displayValue;
            var oldDelCiteId = registerCite(oldDel.fileName, oldDel.paragraphId, c.contractId + ' — Прежний срок поставки: ' + oldDelVal, oldDel.exactQuote || oldDel.quote || '', oldDelVal);
            colDeliv += '<div><span class="old-val-link" onclick="openCite(' + oldDelCiteId + ')">Было: ' + escapeHtml(oldDelVal) + '</span></div>';
          }
        }
        if (deliv.fileName) {
          colDeliv += '<div><button type="button" class="source-btn" onclick="openCite(' + delivCiteId + ')">' + escapeHtml(formatClauseRef(deliv.fileName, deliv.clause)) + '</button></div>';
        }

        // 5. Неустойка (п. 4.1)
        var pen = c.activePenalty || { status: 'missing', displayValue: 'нет данных' };
        var penCiteId = registerCite(
          pen.fileName || (c.relatedDocs[0] && c.relatedDocs[0].fileName) || '01_contract.txt',
          pen.paragraphId || 'p_1',
          c.contractId + ' — Неустойка (п. 4.1): ' + pen.displayValue,
          pen.exactQuote || pen.quote || '',
          pen.displayValue
        );
        var colPenalty = '';
        if (pen.status === 'missing') {
          colPenalty += '<div><span class="badge-missing" onclick="openCite(' + penCiteId + ')">нет данных</span></div>';
        } else {
          colPenalty += '<div><span class="val-primary" onclick="openCite(' + penCiteId + ')">' + escapeHtml(pen.displayValue) + '</span></div>';
          if (pen.financialNote) {
            colPenalty += '<div class="penalty-rub">' + escapeHtml(pen.financialNote) + '</div>';
          }
        }
        if (pen.fileName) {
          colPenalty += '<div><button type="button" class="source-btn" onclick="openCite(' + penCiteId + ')">' + escapeHtml(formatClauseRef(pen.fileName, pen.clause)) + '</button></div>';
        }

        // 6. Сведения для проверки и отсеянные ловушки
        var colVerify = '';
        var warnings = c.warnings || [];
        for (var wIdx = 0; wIdx < warnings.length; wIdx++) {
          var w = warnings[wIdx];
          var wCiteId = registerCite(w.fileName, w.paragraphId || 'p_1', c.contractId + ' — ' + w.title, w.exactQuote || w.quote || '', '');
          colVerify +=
            '<div class="warn-card' + (w.severity === 'high' ? ' high' : '') + '">' +
              '<div class="warn-title">' + escapeHtml(w.title) + '</div>' +
              '<button type="button" class="source-btn" onclick="openCite(' + wCiteId + ')">📄 Проверить: ' + escapeHtml(w.fileName) + '</button>' +
            '</div>';
        }

        var traps = c.ignoredTraps || [];
        if (traps.length > 0) {
          var trapItemsHtml = [];
          for (var tIdx = 0; tIdx < traps.length; tIdx++) {
            var tr = traps[tIdx];
            var trCiteId = registerCite(tr.fileName, tr.paragraphId || 'p_1', c.contractId + ' — Отсеянная ловушка: ' + tr.label, tr.exactQuote || tr.quote || '', tr.value || '');
            trapItemsHtml.push(
              '<div class="trap-item">' +
                '<span>' + escapeHtml(tr.label) + (tr.value ? ' (' + escapeHtml(tr.value) + ')' : '') + '</span>' +
                '<button type="button" class="source-btn" onclick="openCite(' + trCiteId + ')">' + escapeHtml(formatClauseRef(tr.fileName, tr.clause)) + '</button>' +
              '</div>'
            );
          }
          colVerify +=
            '<details class="traps-details">' +
              '<summary>Отсеяно чисел-ловушек: ' + traps.length + ' (показать)</summary>' +
              '<div class="traps-list">' + trapItemsHtml.join('') + '</div>' +
            '</details>';
        }

        rowsHtml.push('<tr class="' + rowClass + '"><td class="col-c1">' + colContract + '</td><td class="col-c2">' + colDocs + '</td><td class="col-c3">' + colAmount + '</td><td class="col-c4">' + colDeliv + '</td><td class="col-penalty">' + colPenalty + '</td><td class="col-c6">' + colVerify + '</td></tr>');
      }
      tbody.innerHTML = rowsHtml.join('');
    }

    function focusCitation(fileName, paragraphId, labelText, exactQuote, highlightToken) {
      activeViewerState.fileName = fileName;
      activeViewerState.paragraphId = paragraphId;
      activeViewerState.labelText = labelText;
      activeViewerState.exactQuote = exactQuote;
      activeViewerState.highlightToken = highlightToken;
      renderViewer();
    }

    function highlightQuoteInText(paraText, exactQuote, highlightToken) {
      var safeText = escapeHtml(paraText);
      var candidates = [];
      if (highlightToken && String(highlightToken).length >= 3 && highlightToken !== 'нет данных') {
        candidates.push(String(highlightToken).replace(/\s*\(с НДС\)/i, '').trim());
      }
      if (exactQuote && String(exactQuote).length >= 4) {
        candidates.push(String(exactQuote).trim());
      }
      for (var i = 0; i < candidates.length; i++) {
        var needle = escapeHtml(candidates[i]);
        if (needle && safeText.indexOf(needle) !== -1) {
          return safeText.replace(needle, '<mark>' + needle + '</mark>');
        }
      }
      return safeText;
    }

    function renderViewer() {
      var parsedDocs = (resolvedState && resolvedState.parsedDocs) || [];
      if (parsedDocs.length === 0) return;

      var targetDoc = parsedDocs[0];
      for (var i = 0; i < parsedDocs.length; i++) {
        if (parsedDocs[i].fileName === activeViewerState.fileName) {
          targetDoc = parsedDocs[i];
          break;
        }
      }
      activeViewerState.fileName = targetDoc.fileName;

      // Вкладки файлов
      var tabsHtml = [];
      for (var j = 0; j < parsedDocs.length; j++) {
        var d = parsedDocs[j];
        var isCurrent = (d.fileName === targetDoc.fileName);
        tabsHtml.push(
          '<button type="button" class="file-tab' + (isCurrent ? ' active' : '') + '" onclick="focusCitation(\'' + escapeAttr(d.fileName) + '\', \'p_1\', \'Просмотр файла ' + escapeAttr(d.fileName) + '\', \'\', \'\')">' +
            escapeHtml(d.fileName) +
          '</button>'
        );
      }
      document.getElementById('viewerTabs').innerHTML = tabsHtml.join('');

      // Бейдж статуса документа
      var badge = document.getElementById('viewerDocSignBadge');
      if (targetDoc.isSigned) {
        badge.className = 'badge-sign badge-signed';
        badge.textContent = 'Подписан обеими сторонами';
      } else {
        badge.className = 'badge-sign badge-unsigned';
        badge.textContent = 'Не подписан / Проект или письмо';
      }

      // Поиск активного абзаца и рендер текста
      var activeClauseLabel = 'Шапка';
      var activeQuoteText = activeViewerState.exactQuote || '';
      var parasHtml = [];
      var paragraphs = targetDoc.paragraphs || [];

      for (var k = 0; k < paragraphs.length; k++) {
        var p = paragraphs[k];
        var isParaActive = (p.id === activeViewerState.paragraphId);
        var clauseText = p.clause ? ('п. ' + p.clause) : 'Шапка';
        if (isParaActive) {
          activeClauseLabel = clauseText;
          if (!activeQuoteText) activeQuoteText = p.text;
        }
        var formattedText = isParaActive
          ? highlightQuoteInText(p.text, activeViewerState.exactQuote, activeViewerState.highlightToken)
          : escapeHtml(p.text);

        parasHtml.push(
          '<div id="viewer_para_' + escapeAttr(p.id) + '" class="para-row' + (isParaActive ? ' active' : '') + '">' +
            '<div class="para-clause">' + escapeHtml(clauseText) + '</div>' +
            '<div class="para-text">' + formattedText + '</div>' +
          '</div>'
        );
      }
      document.getElementById('viewerBody').innerHTML = parasHtml.join('');

      // Желтая плашка проверяемой цитаты
      var bannerHtml =
        '<div><strong>Проверка:</strong> ' + escapeHtml(activeViewerState.labelText || targetDoc.fileName) +
        ' &nbsp;|&nbsp; <strong>Источник:</strong> ' + escapeHtml(targetDoc.fileName) + ' (' + escapeHtml(activeClauseLabel) + ')</div>';
      if (activeQuoteText) {
        bannerHtml += '<div class="citation-banner-quote">«' + escapeHtml(activeQuoteText) + '»</div>';
      }
      document.getElementById('activeCitationBanner').innerHTML = bannerHtml;

      // Плавная прокрутка к активному абзацу в центр
      if (activeViewerState.paragraphId) {
        var activeEl = document.getElementById('viewer_para_' + activeViewerState.paragraphId);
        if (activeEl && typeof activeEl.scrollIntoView === 'function') {
          activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function openSelfTestsModal() {
      var report = window.STNEngine.runSelfTests();
      document.getElementById('selftestSummaryTitle').textContent =
        'Пройдено ' + report.passedCount + ' из ' + report.total + ' тестов';

      var itemsHtml = [];
      for (var i = 0; i < report.tests.length; i++) {
        var t = report.tests[i];
        itemsHtml.push(
          '<div class="test-item' + (t.passed ? '' : ' fail') + '">' +
            '<div style="font-weight:700; margin-bottom:2px;">' +
              (t.passed ? '✅ ' : '❌ ') + escapeHtml(t.name) +
            '</div>' +
            '<div style="color:var(--text-secondary); font-family:var(--font-mono); font-size:11px;">' +
              escapeHtml(t.actual) +
            '</div>' +
          '</div>'
        );
      }
      document.getElementById('selftestGrid').innerHTML = itemsHtml.join('');
      document.getElementById('selftestModalBackdrop').className = 'modal-backdrop visible';
    }

    function closeSelfTestsModal() {
      document.getElementById('selftestModalBackdrop').className = 'modal-backdrop';
    }

    function onModalBackdropClick(event) {
      if (event.target && event.target.id === 'selftestModalBackdrop') {
        closeSelfTestsModal();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\r?\n/g, ' ');
    }

    window.addEventListener('DOMContentLoaded', function () {
      if (!window.STNEngine) {
        alert('Не найден файл engine.js. Убедитесь, что engine.js находится в одной папке с index.html.');
        return;
      }
      setupDragAndDrop();
      resetToDemoFiles();
    });
  </script>
</body>
</html>
